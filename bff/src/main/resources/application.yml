server:
  port: 8080

spring:
  application:
    name: bff

# Tenant de Microsoft Entra ID (SDD §22). El JwtDecoder usa esto para el JWKS
# y para validar el issuer (acepta v1 y v2).
azure:
  tenant-id: ${AZURE_TENANT_ID}

# Audiencia esperada del token (claim aud) — la API expuesta en Entra ID (SDD §22).
security:
  jwt:
    audience: ${AZURE_AUDIENCE:api://${AZURE_CLIENT_ID}}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

# URL interna del microservicio de pedidos (SDD §29).
ms:
  pedidos:
    url: ${MS_PEDIDOS_URL:http://localhost:8081}
